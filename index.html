<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La roue de la defonce </title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#43205d 0,#17101f 48%,#08070c 100%);color:#fff;display:flex;justify-content:center;padding:24px 16px 40px}.card{width:min(100%,520px);margin-top:22px;padding:30px 18px 28px;border:1px solid rgba(255,255,255,.22);border-radius:28px;background:rgba(35,25,43,.78);box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}h1{margin:0 0 12px;font-size:34px;line-height:1.08}p{margin:0 0 24px;font-size:20px;line-height:1.35;opacity:.9}input{width:100%;height:68px;border-radius:22px;border:2px solid rgba(255,255,255,.16);background:#101017;color:#fff;text-align:center;font-size:25px;letter-spacing:2px;outline:none;text-transform:uppercase}button{width:100%;height:68px;margin-top:22px;border:0;border-radius:22px;color:#fff;font-size:22px;font-weight:800;background:linear-gradient(90deg,#b31cff,#ff2d87)}button:disabled{opacity:.5}#status{min-height:28px;margin-top:18px;font-size:16px}#game{display:none}.wheel{width:min(82vw,360px);aspect-ratio:1;margin:18px auto;border-radius:50%;border:10px solid #f5c84c;background:conic-gradient(#9c27ff 0 60deg,#ff3b7d 60deg 120deg,#19c37d 120deg 180deg,#ff8a00 180deg 240deg,#29a3ff 240deg 300deg,#ffd166 300deg 360deg);box-shadow:0 0 0 5px rgba(255,255,255,.12),0 20px 45px rgba(0,0,0,.45);display:grid;place-items:center;transition:transform 4.5s cubic-bezier(.12,.7,.1,1)}.wheel-center{width:76px;height:76px;border-radius:50%;background:#11111a;border:4px solid white;display:grid;place-items:center;font-size:30px}.result{display:none}.result h2{font-size:34px;margin:12px 0}.prize{font-size:30px;font-weight:900}
</style>
</head>
<body>
<main class="card">
<section id="form">
<h1>🎁 La roue de la defonce</h1>
<p>Entre ton code secret pour tenter ta chance.</p>
<input id="code" autocomplete="off" autocapitalize="characters" maxlength="32" placeholder="CODE SECRET">
<button id="spin">TOURNER LA ROUE</button>
<div id="status"></div>
</section>
<section id="game">
<h1>🎡 Bonne chance !</h1>
<div class="wheel" id="wheel"><div class="wheel-center">🎁</div></div>
<div class="result" id="result"><h2>Résultat</h2><div class="prize" id="prize"></div></div>
</section>
</main>
<script>
(function(){
try{if(window.Telegram&&window.Telegram.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand();}}catch(e){}
const FUNCTION_URL="https://xjvdwsbjqfhiibyiwysc.supabase.co/functions/v1/play-spin";
const outcomes=["+10 %","PERDU","+10 %","PERDU","10 €","PERDU"];
const codeEl=document.getElementById("code"),spinBtn=document.getElementById("spin"),statusEl=document.getElementById("status"),form=document.getElementById("form"),game=document.getElementById("game"),wheel=document.getElementById("wheel"),result=document.getElementById("result"),prizeEl=document.getElementById("prize");
function setStatus(m){statusEl.textContent=m||""}
spinBtn.addEventListener("click",async function(){
const code=codeEl.value.trim().toUpperCase(); if(!code){setStatus("Entre ton code secret.");return}
const tg=window.Telegram&&window.Telegram.WebApp,initData=tg?tg.initData:"";
if(!initData){setStatus("Ouvre cette page depuis Telegram pour jouer.");return}
spinBtn.disabled=true;setStatus("Vérification du code…");
try{
const response=await fetch(FUNCTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,initData})});
const data=await response.json().catch(()=>({}));
if(!response.ok||!data.success){if(data.error==="invalid_or_used_code")throw new Error("Code invalide ou déjà utilisé.");if(data.error==="invalid_or_expired_telegram_data")throw new Error("Session Telegram expirée. Ferme puis rouvre la Mini App.");throw new Error("Erreur HTTP "+response.status+" : "+(data.error||"réponse inconnue"))}
const prize=String(data.prize||""),index=outcomes.indexOf(prize);if(index<0)throw new Error("Résultat reçu non reconnu.");
form.style.display="none";game.style.display="block";result.style.display="none";
const target=index*60+30,rotation=6*360+(360-target);requestAnimationFrame(()=>wheel.style.transform="rotate("+rotation+"deg)");
setTimeout(()=>{prizeEl.textContent=prize;result.style.display="block"},4700);
}catch(err){setStatus(err&&err.message?err.message:"Une erreur est survenue.");spinBtn.disabled=false}
});
window.addEventListener("load",function(){try{if(window.Telegram&&window.Telegram.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand();}}catch(e){}});
})();
</script>
</body></html>
